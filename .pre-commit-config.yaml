repos:
  - repo: local
    hooks:
      - id: mkdocs-build
        name: mkdocs build --strict
        entry: .venv/bin/mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml)

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ^\.claude/
