name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false  # Complete deployment before starting new one

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docs-deployment-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 📚 Documentation Deployment"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Build | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| Deploy | ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo ""
            if [ "${{ needs.deploy.result }}" == "success" ]; then
              echo "**Status**: ✅ Deployment successful"
            else
              echo "**Status**: ❌ Deployment failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
